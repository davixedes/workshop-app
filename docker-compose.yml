services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop123
      POSTGRES_DB: workshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack-setup:
    image: amazon/aws-cli
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name workshop-orders &&
      echo 'SQS queue created'
      "

  orders-service:
    build: ./orders-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://workshop:workshop123@postgres:5432/workshop
      SQS_QUEUE_URL: http://localstack:4566/000000000000/workshop-orders
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack-setup:
        condition: service_completed_successfully

  inventory-service:
    build: ./inventory-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://workshop:workshop123@postgres:5432/workshop
      SQS_QUEUE_URL: http://localstack:4566/000000000000/workshop-orders
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack-setup:
        condition: service_completed_successfully
